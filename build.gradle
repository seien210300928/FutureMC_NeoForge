plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // 指定要使用的 NeoForge 版本。
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 此行可选。访问转换器（Access Transformer）会自动被检测到
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // 默认运行配置。
    // 这些配置可以根据需要调整、删除或复制。
    runs {
        client {
            client()

            // 逗号分隔的命名空间列表，用于指定从哪些命名空间加载游戏测试。留空 = 所有命名空间。
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 该运行配置会启动 GameTestServer，运行所有已注册的游戏测试，然后退出。
        // 默认情况下，如果没有提供任何游戏测试，服务器会崩溃。
        // 对于其他运行配置，游戏测试系统也会在 /test 命令下默认启用。
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // 覆盖上方 configureEach 中设置的工作目录（workingDirectory）的示例，如需使用请取消注释
            // gameDirectory = project.file('run-data')

            // 指定数据生成所用的模组 ID、生成资源的输出位置，以及已有资源的查找位置。
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 应用于上方所有运行配置
        configureEach {
            // 推荐用于 userdev 环境的日志数据
            // 标记（markers）可根据需要以逗号分隔进行增删。
            // "SCAN"：用于模组扫描。
            // "REGISTRIES"：用于触发注册表事件。
            // "REGISTRYDUMP"：用于获取所有注册表的内容。
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // 推荐的控制台日志级别
            // 你可以在这里设置各种级别。
            // 请参阅：https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // 定义模组与源集（source set）之间的绑定
        // 用于告诉游戏哪些源码属于哪个模组
        // 在单模组项目中大多是可选的
        // 但多模组项目应为每个模组各定义一个
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 包含数据生成器生成的资源。
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // 以 JEI 为例的模组依赖示例
    // JEI API 声明为编译期使用，完整的 JEI 构件则用于运行时
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // 使用 ./libs 目录下的模组 JAR 作为依赖的示例（扁平目录仓库）
    // 这对应 ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // 搜索时组 ID（group id）会被忽略——在此例中为 "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // 以文件形式添加依赖的示例
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // 使用同级或子项目的项目依赖示例：
    // implementation project(":myproject")

    // 更多信息：
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// 此代码块会在指定的资源目标中展开所有已声明的替换属性。
// 缺少属性将导致报错。属性使用 ${} Groovy 语法进行展开。
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// 将 "generateModMetadata" 的输出作为构建的输入目录包含进来
// 通过 Gradle 和 IDE 构建时均适用。
sourceSets.main.resources.srcDir generateModMetadata
// 为避免手动运行 "generateModMetadata"，让它在每次项目重载时自动执行
neoForge.ideSyncTask generateModMetadata

// 使用 maven-publish 插件进行发布的示例配置
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA 不再自动为依赖下载源码/Javadoc JAR，因此我们需要显式启用该行为。
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

# 设置 gradle 命令使用的默认内存。可通过用户或命令行属性覆盖。
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## 环境属性
# 可在此处查找最新版本：https://projects.neoforged.net/neoforged/neoforge
# Minecraft 版本必须与 Neo 版本保持一致，才能获得有效的构件
minecraft_version=1.21.1
# Minecraft 版本范围可使用任意正式版 Minecraft 版本作为边界。
# 快照（Snapshot）、预发布版（pre-release）和候选发布版（release candidate）无法保证正确排序，
# 因为它们不遵循标准的版本命名规范。
minecraft_version_range=[1.21.1]
# Neo 版本必须与 Minecraft 版本保持一致，才能获得有效的构件
neo_version=21.1.1
# Neo 版本范围可使用任意 Neo 版本作为边界
neo_version_range=[21,)
# 加载器版本范围只能使用 FML 的主版本号作为边界
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
## 模组属性
# 模组的唯一标识符。必须为英文小写，且需符合正则表达式 [a-z][a-z0-9_]{1,63}
# 必须与带 @Mod 注解的主模组类中的 String 常量保持一致。
mod_id=futuremc_neoforge
# 模组的人类可读显示名称。
mod_name=FutureMC NeoForge
# 模组的许可证。可前往 https://choosealicense.com/ 了解你的可选方案。默认保留所有权利（All Rights Reserved）。
mod_license=GNU AGPL 3.0
# 模组版本。参见 https://semver.org/
mod_version=21.2-1.0.0
# 模组的组 ID（group ID）。仅当作为构件发布到 Maven 仓库时才重要。
# 此处应与模组源码使用的基础包名保持一致。
# 参见 https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=org.dpdns.seien
# 模组的作者。这是一个用于在模组列表中展示的简单文本字符串。
mod_authors=Seien_MtF
# 模组的描述。这是一个用于在模组列表中展示的简单多行文本字符串。
mod_description=Bringing all the future to the present
